<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · 课件</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script>
(function () {
  try {
    var mode = localStorage.getItem('theme') || 'system';
    var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.themeMode = mode;
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="topbar">
  <nav>
    <a href="/" data-nav="site">← 返回站点</a>
  </nav>
  <div class="spacer"></div>
  <button id="themeBtn" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="8"></circle>
      <path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"></path>
    </svg>
  </button>
  <button id="logoutBtn" class="btn small" type="button">登出</button>
</header>

<main class="admin-shell">
  <div class="admin-head">
    <h1>管理后台</h1>
    <div class="spacer"></div>
    <span id="globalNotice" class="muted"></span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="pages" type="button">课件</button>
    <button class="tab" data-tab="site" type="button">站点页面</button>
    <button class="tab" data-tab="backup" type="button">备份</button>
    <button class="tab" data-tab="sessions" type="button">会话</button>
  </div>

  <section id="tab-pages">
    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head">
          <h2>课程树</h2>
          <button id="newFolderBtn" class="btn small" type="button">新建</button>
          <button id="refreshTreeBtn" class="btn small" type="button">刷新</button>
        </div>
        <div id="adminTree" class="admin-tree"></div>
        <p class="panel-hint">
          拖动课件或文件夹到目标文件夹可移动；双击名称可改名；删除需连点两次。
        </p>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2 id="pagesTitle">课件</h2>
          <div class="spacer"></div>
          <button id="uploadBtn" class="btn small" type="button">上传课件</button>
          <button id="importBtn" class="btn small" type="button">导入文件夹</button>
          <input id="uploadInput" type="file" accept=".html,.htm" hidden>
          <input id="importInput" type="file" webkitdirectory multiple accept=".html,.htm" hidden>
        </div>
        <div id="pagesNotice" class="notice hidden"></div>
        <div id="pagesList" class="list"></div>
      </div>
    </div>
  </section>

  <section id="tab-site" hidden>
    <div class="panel" style="max-width:900px">
      <div class="panel-head">
        <h2>站点页面</h2>
        <select id="siteSlug" style="width:auto;min-width:120px">
          <option value="home">首页</option>
          <option value="about">个人</option>
        </select>
      </div>
      <div class="panel-body">
        <div id="siteNotice" class="notice hidden"></div>
        <div class="field">
          <label for="siteTitle">标题</label>
          <input id="siteTitle" type="text" maxlength="100">
        </div>
        <div class="field">
          <label for="siteBody">正文（纯文本，换行即段落）</label>
          <textarea id="siteBody"></textarea>
        </div>
        <button id="saveSiteBtn" class="btn primary" type="button">保存</button>
      </div>
    </div>
  </section>

  <section id="tab-backup" hidden>
    <div class="panel" style="max-width:760px">
      <div class="panel-head"><h2>数据库备份</h2></div>
      <div class="panel-body">
        <p class="muted">使用 <span class="mono">VACUUM INTO</span> 生成一致性快照，文件位于数据目录的 <span class="mono">backups/</span>。</p>
        <div id="backupNotice" class="notice hidden"></div>
        <button id="backupBtn" class="btn primary" type="button">立即备份</button>
      </div>
    </div>
  </section>

  <section id="tab-sessions" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>活跃会话</h2>
        <div class="spacer"></div>
        <button id="refreshSessionsBtn" class="btn small" type="button">刷新</button>
        <button id="deleteOtherSessionsBtn" class="btn small danger" type="button">踢掉其他所有会话</button>
      </div>
      <div id="sessionsNotice" class="notice hidden"></div>
      <div id="sessionsList" class="panel-body flush"></div>
    </div>
  </section>
</main>

<div id="ctxMenu" class="ctx-menu" hidden></div>
<script src="/static/admin.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 课件管理</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script>
(function () {
  try {
    var mode = localStorage.getItem('theme') || 'system';
    var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>管理员登录</h1>
    <p>单管理员站点。密码错误 5 次后锁定 15 分钟。</p>
    <div id="err" class="login-error" hidden>密码错误，或尝试次数过多。</div>
    <form method="post" action="/admin/login">
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      </div>
      <button class="btn primary" type="submit" style="width:100%">登录</button>
    </form>
    <p style="margin:18px 0 0;text-align:center"><a href="/">← 返回站点</a></p>
  </div>
</div>
<script>
if (new URLSearchParams(location.search).get('e') === '1') {
  document.getElementById('err').hidden = false;
}
</script>
</body>
</html>

services:
  homelab-teach:
    build: .
    image: homelab-teach:latest
    container_name: homelab-teach
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ./data:/data
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
